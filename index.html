  :root{
    --bg:#EDE4FB; --panel:#FFFFFF; --ink:#1C1230; --ink-soft:#7A6C99;
    --line:#E2D3FA; --danger:#FF3B5C;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#130C22; --panel:#231935; --ink:#F6F1FF; --ink-soft:#B8A8DE; --line:#372A54; }
  }
  :root[data-theme="dark"]{ --bg:#130C22; --panel:#231935; --ink:#F6F1FF; --ink-soft:#B8A8DE; --line:#372A54; }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{overscroll-behavior:none; -webkit-tap-highlight-color:transparent;}
  button, .pill, .mult label, .badge, .logo, .leather-title, .float-toggle{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  /* light mode on a home-screen iPhone: dark strip so the white status-bar text stays readable */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) body::before{content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:#111312; z-index:50;}
  }
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 500px at 0% -10%, rgba(139,92,246,.30), transparent 60%),
      radial-gradient(800px 460px at 100% 0%, rgba(255,45,149,.24), transparent 60%),
      radial-gradient(900px 520px at 50% 105%, rgba(34,211,238,.20), transparent 60%),
      var(--bg);
    background-repeat:no-repeat;
  }
  .num{font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; font-weight:800;}

  .wrap{max-width:640px; margin:0 auto; padding:32px 20px 80px;}
  header{margin-bottom:26px; display:flex; align-items:center; gap:4px;}
  .logo{flex:0 0 auto; filter:drop-shadow(0 8px 16px rgba(124,58,237,.4)) drop-shadow(0 2px 0 rgba(255,255,255,.6)); width:auto; height:78px;}
  h1{margin:0;}
  .leather-title{
    display:block; width:214px; height:auto;
    filter:drop-shadow(0 3px 3px rgba(30,10,60,.55));
  }
  .leather-title text{ font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; }

  .row{
    position:relative; background:linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 92%, #000 3%));
    border:1px solid var(--line); border-radius:20px; padding:18px;
    margin-bottom:20px; display:flex; gap:14px; align-items:flex-start;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 22px 34px -20px var(--shadow, rgba(30,10,60,.35)),
      0 3px 8px -2px rgba(30,10,60,.15);
  }

  .badge{
    flex:0 0 auto; width:50px; height:50px; border-radius:50%; background:var(--track);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#fff; margin-top:2px; position:relative; overflow:hidden;
    box-shadow:
      0 6px 14px -3px var(--shadow, rgba(0,0,0,.5)),
      inset 0 2px 3px rgba(255,255,255,.55),
      inset 0 -6px 10px rgba(0,0,0,.25);
  }
  .badge::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 28% 22%, rgba(255,255,255,.5), transparent 32%);
  }
  .badge span{
    position:relative; z-index:1;
    text-shadow:
      0 1px 0 rgba(0,0,0,.35),
      0 2px 3px rgba(0,0,0,.45);
    -webkit-text-stroke:0.6px rgba(0,0,0,.30);
  }

  .ver{font-size:12px; margin-left:4px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); vertical-align:1px;}
  .title-row{display:flex; align-items:flex-end; gap:0; flex-wrap:wrap;}
  .byline{margin:0 0 30px; font-size:15px; line-height:1.2; color:var(--ink-soft); white-space:nowrap;}
  .float-toggle{display:inline-flex; align-items:center; gap:10px; margin:-14px 0 0 14px; cursor:pointer; user-select:none;
    font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; font-weight:800; font-size:19px; color:#fff;
    -webkit-text-stroke:4px #5B1A9E; paint-order:stroke fill; text-shadow:0 2px 3px rgba(20,5,40,.55);}
  .float-toggle[hidden]{display:none;}
  .float-msg{display:block; margin:4px 0 0 14px; font-size:13px; font-weight:700; color:var(--danger); min-height:1em;}
  .float-toggle input{width:22px; height:22px; margin:0; cursor:pointer; accent-color:#7C3AED;}
  .float-note{font-size:14px; color:var(--ink-soft); text-align:center; padding:30px 0;}
  body.pip{padding:10px; overflow-y:auto;}
  body.pip .row:not(.active){display:none;}
  .pip-empty{display:none;}
  body.pip .pip-empty{display:block; font-size:14px; color:var(--ink-soft); text-align:center; padding:24px 10px;}
  body.pip:has(.row.active) .pip-empty{display:none;}
  body.pip .row{padding:10px 12px; margin-bottom:8px; gap:10px; border-radius:14px;}
  body.pip .badge{width:34px; height:34px; font-size:13px;}
  body.pip .side{flex-basis:52px; gap:4px;}
  body.pip .phase{font-size:10px;}
  body.pip .btn.primary{min-width:70px;}
  body.pip .custom-dur, body.pip .mult, body.pip .total{display:none;}
  body.pip .top{margin-bottom:6px;}
  body.pip .name{font-size:13px;}
  body.pip .clock{font-size:21px;}
  body.pip .pill{height:26px; padding:4px;}
  body.pip .pill-fill{min-width:18px;}
  body.pip .controls{margin-top:8px; gap:8px;}
  body.pip .btn{padding:6px 12px; font-size:12px;}
  .body{flex:1; min-width:0;}
  .btn{min-height:44px;}
  .mult label{min-height:40px; font-size:13px;}
  .a2hs{display:flex; align-items:center; gap:10px; margin:-10px 0 18px; padding:10px 12px; border-radius:14px; font-size:14px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-soft);}
  .a2hs[hidden]{display:none;}
  .a2hs b{color:var(--ink);}
  .a2hs svg{vertical-align:-2px; color:var(--ink);}
  .a2hs button{margin-left:auto; flex:0 0 auto; width:32px; height:32px; border:none; border-radius:50%; background:var(--bg); color:var(--ink); font-size:20px; line-height:1; cursor:pointer;}
  .break-card{--track:linear-gradient(90deg,#F7D774,#C8962E); --track-solid:#A87B1F; --on-track:#2B1D00; --shadow:rgba(200,150,46,.45);
    --gold:#B8860B; border-color:rgba(200,150,46,.55);
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 90%, #D4A43A 10%), var(--panel));}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .break-card{--gold:#F2C94C;} }
  :root[data-theme="dark"] .break-card{--gold:#F2C94C;}
  .break-card .name{color:var(--gold);}
  .break-card .badge svg{position:relative; z-index:1;}
  .break-hint{font-size:12px; color:var(--ink-soft); margin-top:-6px;}
  .break-card .mult{margin-top:8px;}
  .bk-custom{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);}
  .bk-custom input{width:64px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink);
    padding:7px 8px; font-size:16px; font-family:inherit; box-shadow:inset 0 2px 4px rgba(0,0,0,.14);}
  .bk-custom.active{color:var(--gold); font-weight:700;}
  .bk-custom.active input{border:2px solid #C8962E; background:color-mix(in srgb, var(--bg) 80%, #F2C94C 20%); font-weight:700;}
  .row.on-break .pill{background:linear-gradient(90deg,#F7D774,#C8962E);}
  .phase.break{color:#C8962E; font-weight:700;}
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px;}
  .name{font-size:15px; font-weight:800;}
  .side{flex:0 0 64px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .phase{font-size:12px; line-height:1.3; color:var(--ink-soft); text-align:center; white-space:pre-line;}
  .btn.primary{min-width:92px;}
  .phase.work{color:#00A87A; font-weight:700;}
  .phase.done{color:var(--danger); font-weight:700;}
  .clock{font-size:30px; line-height:1; letter-spacing:.5px; transition:color .3s; white-space:nowrap; text-shadow:0 1px 0 rgba(255,255,255,.5);}

  .custom-dur{display:flex; align-items:center; gap:4px; margin-bottom:10px;}
  .custom-dur .cf{display:flex; flex-direction:column; align-items:flex-start;}
  .custom-dur label{font-size:10px; color:var(--ink-soft);}
  .custom-dur input{
    width:44px; border:1px solid var(--line); border-radius:7px; background:var(--bg);
    color:var(--ink); padding:7px 6px; font-size:16px; font-family:inherit; width:52px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.14);
  }
  .custom-dur .colon{font-size:16px; font-weight:700; margin-top:12px; color:var(--ink-soft);}

  .pill{
    position:relative; height:44px; border-radius:999px; padding:5px;
    background:var(--track); display:flex; align-items:center;
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,.35),
      inset 0 -1px 0 rgba(255,255,255,.25),
      0 1px 0 rgba(255,255,255,.5);
    cursor:pointer; touch-action:none; user-select:none;
  }
  .pill-fill{
    height:100%; min-width:26px; border-radius:999px;
    background:linear-gradient(180deg,#ffffff,#eef0f5 55%,#dfe2ea);
    box-shadow:
      0 2px 4px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 3px rgba(0,0,0,.08);
    transition:width .2s linear;
  }
  .pill.dragging .pill-fill{transition:none;}
  .row .badge span{color:var(--on-track); text-shadow:0 1px 0 rgba(255,255,255,.5); -webkit-text-stroke:0;}
  .row .btn.primary, .row .mult label.active{color:var(--on-track);}
  .row.ending .clock{color:var(--danger);}
  .row.ending .pill{animation:endpulse 1s ease-in-out infinite;}
  @keyframes endpulse{ 0%,100%{filter:none;} 50%{filter:brightness(1.18) drop-shadow(0 0 8px rgba(255,59,92,.75));} }
  @media (prefers-reduced-motion: reduce){ .row.ending .pill{animation:none;} }
  .pill.done{ background:linear-gradient(90deg, var(--danger), #FF7A93); }

  .mult{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .mult label{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:9px; padding:6px 10px; cursor:pointer;
    background:var(--panel); box-shadow:0 2px 4px rgba(30,10,60,.08), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .mult input{cursor:pointer;}
  .mult label.active{
    color:#fff; border-color:transparent; font-weight:700; background:var(--track);
    box-shadow:0 4px 10px -2px var(--shadow, rgba(0,0,0,.5)), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.2);
  }

  .total{font-size:12px; color:var(--ink-soft); margin-top:10px;}
  .total b{color:var(--ink); font-weight:700;}

  .controls{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .btn{
    border:none; background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 18px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
    box-shadow:0 3px 0 var(--line), 0 6px 10px -4px rgba(30,10,60,.25), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--line), 0 2px 4px -2px rgba(30,10,60,.25); }
  .btn.primary{
    background:var(--track); color:#fff;
    box-shadow:0 4px 0 color-mix(in srgb, var(--track-solid, #7C3AED) 70%, #000), 0 8px 14px -4px var(--shadow, rgba(0,0,0,.5)), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn.primary:active{ box-shadow:0 0 0 transparent, 0 2px 6px -2px var(--shadow, rgba(0,0,0,.4)); }
  .btn.ghost{ background:var(--bg); }

  @media (max-width:480px){
    .title-row{flex-direction:column; align-items:flex-start; gap:0;}
    .byline{margin:-14px 0 0 6px;}
    .float-toggle{margin-top:6px;}
    .wrap{padding:24px 14px 60px;}
    .row{padding:14px; gap:10px;}
    .side{flex-basis:52px;}
    .top{flex-direction:column; align-items:flex-start; gap:2px;}
    .clock{font-size:44px; letter-spacing:1px;}
    .name{white-space:nowrap;}
  }
  /* iPad and larger: timers side by side, bigger clock */
  @media (min-width:760px){
    .wrap{max-width:1100px; padding:40px 28px 80px;}
    #rows{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
    #rows .row{margin-bottom:0;}
    .break-card{margin-top:20px;}
    .clock{font-size:40px;}
    .leather-title{width:260px;}
    #rows{align-items:stretch;}
    #rows .row{height:100%;}
    #rows .body{display:flex; flex-direction:column; align-self:stretch;}
    #rows .controls{margin-top:auto; padding-top:14px;}
    .side .custom-dur{flex-direction:column; align-items:center; gap:8px; margin:6px 0 0;}
    .side .custom-dur .cf{align-items:center;}
    .side .custom-dur .colon{display:none;}
    .side .custom-dur input{width:52px; text-align:center;}
    #rows .mult{gap:6px; flex-wrap:nowrap;}
    #rows .mult label{padding:6px 7px; gap:5px; font-size:12px; flex:1 1 0; justify-content:center; min-width:0;}
  }
  @media (min-width:1180px){ .clock{font-size:44px;} }

  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(timers.map(t=>({

        remaining:t.remaining, running:t.running, last:t.last, onBreak:t.onBreak, breakTotal:t.breakTotal
      }))));
    }catch(e){ /* storage unavailable */ }
  }
  function loadState(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if(!Array.isArray(saved)) return;
      for(const s of saved){
        const t = timers.find(x=>x.id===s.id);

        if(t.mults.includes(s.rounds) || s.rounds===1) t.rounds = s.rounds;

        t.remaining = typeof s.remaining==='number' ? s.remaining : t.base;

      osc.type = 'sine';

      gain.gain.linearRampToValueAtTime(0.7, t0 + 0.015);

  const clipBuffers = {};
  function clipBuffer(text){
    if(clipBuffers[text]) return clipBuffers[text];
    const b64 = VOICE_PCM[text]; if(!b64 || !audioCtx) return null;
    const bin = atob(b64), n = bin.length >> 1;
    const ab = audioCtx.createBuffer(1, n, VOICE_RATE), ch = ab.getChannelData(0);
    for(let i=0;i<n;i++){
      let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8);
      if(v >= 32768) v -= 65536;
      ch[i] = v / 32768;
    }
    return (clipBuffers[text] = ab);
  }
  function loadClips(){ try{ Object.keys(VOICE_PCM).forEach(clipBuffer); }catch(e){} }
  function playClip(text){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state !== 'running') audioCtx.resume();
      const ab = clipBuffer(text); if(!ab) return false;

  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') syncWakeLock();
  });

  function ensureTick(){
    syncWakeLock();
    if(ticking) return;
    ticking = true;
    raf(tick);
  }

  function tick(){
    const now = Date.now();
    let anyRunning = false, finished = false;
    for(const t of timers){
      if(!t.running) continue;
      anyRunning = true;
      const dt = (now - t.last)/1000;
      t.last = now;
      t.remaining -= dt;
      let last = null, lateBy = 0;
      while(t.running && t.remaining <= 0){
        lateBy = -t.remaining;
        if(t.onBreak){                                  // break over -> next repeat
          t.onBreak = false; t.round += 1; t.remaining += t.base; last = 'go';
        } else if(t.round >= t.rounds){                 // all repeats done
          t.round = 1; t.phase = 'idle'; t.remaining = t.base; t.running = false; t.onBreak = false;
          finished = true; last = 'end';
        } else if(breakSecs > 0){                       // repeat done -> break
          t.onBreak = true; t.breakTotal = breakSecs; t.remaining += breakSecs; last = 'break';
        } else {                                        // repeat done, no break
          t.round += 1; t.remaining += t.base; last = 'round';
        }
      }
      if(last){
        if(lateBy < 3){   // no surprise sounds for something that ended long ago
          if(last === 'break'){ dingEnd(); setTimeout(()=>say('Break!'), 550); }
          else if(last === 'go') say('Go again!');
          else dingEnd();
        }
        saveState();
      }
    }
    updateDom();
    if(finished && pipWin && !timers.some(t=>t.phase==='work')){ pipWin.close(); return; }
    if(anyRunning){ raf(tick); } else { ticking = false; syncWakeLock(); }
  }

  function pctOf(t){
    const total = t.onBreak ? t.breakTotal : t.base;
    return total>0 ? Math.min(100, Math.max(0, 100*(1 - t.remaining/total))) : 0;
  }

  function seekPill(t, pillEl, clientX){
    const rect = pillEl.getBoundingClientRect();
    let ratio = rect.width>0 ? (clientX - rect.left) / rect.width : 0;
    ratio = Math.min(1, Math.max(0, ratio));
    t.remaining = (t.onBreak ? t.breakTotal : t.base) * (1 - ratio);
    if(t.phase === 'idle' || t.phase === 'done') t.phase = 'work';
    updateDom();
  }

  function render(){
    rowsEl.innerHTML = '';
    timers.forEach((t, idx)=>{
      const row = document.createElement('div');
      row.className = 'row' + (t.phase==='work' ? ' active' : '');
      row.style.setProperty('--on-track', t.ink);
      row.dataset.id = t.id;
      row.style.setProperty('--shadow', t.shadow);
      row.style.setProperty('--track-solid', t.solid);
      const pct = t.phase==='idle' ? 0 : pctOf(t);

      const durH = Math.floor(t.base/3600), durM = Math.floor((t.base%3600)/60), durS = t.base%60;

      row.innerHTML = `
        <div class="side">
          <div class="badge" style="--track:${t.track}"><span>${String(idx+1).padStart(2,'0')}</span></div>
          <div class="phase" data-role="phase"></div>
        </div>
        <div class="body">
          <div class="top">
            <div>
              <div class="name">${t.name}</div>
            </div>
            <div class="clock num" data-role="clock">${fmt(t.remaining)}</div>
          </div>
          ${t.custom ? `
          <div class="custom-dur">
            <div class="cf"><label>hh</label><input type="number" min="0" max="99" step="1" inputmode="numeric" pattern="[0-9]*" data-role="ch" value="${durH}" ${t.phase!=='idle'?'disabled':''}></div>
            <div class="colon">:</div>
            <div class="cf"><label>mm</label><input type="number" min="0" max="59" step="1" inputmode="numeric" pattern="[0-9]*" data-role="cm" value="${durM}" ${t.phase!=='idle'?'disabled':''}></div>
            <div class="colon">:</div>
            <div class="cf"><label>ss</label><input type="number" min="0" max="59" step="1" inputmode="numeric" pattern="[0-9]*" data-role="cs" value="${durS}" ${t.phase!=='idle'?'disabled':''}></div>
          </div>` : ''}
          <div class="pill ${t.phase==='done'?'done':''}" data-role="pill" style="--track:${t.track}">
            <div class="pill-fill" data-role="pillfill" style="width:${pct}%"></div>
          </div>
          <div class="mult" data-role="mult">
            ${(t.mults||DEFAULT_MULTS).map(m => `<label data-m="${m}" style="--track:${t.track}"><input type="checkbox" data-role="mchk" value="${m}" ${t.rounds===m?'checked':''}> x${m}</label>`).join('')}
          </div>
          <div class="total" data-role="total"></div>
          <div class="controls">
            <button class="btn primary" data-role="startpause" style="--track:${t.track}"></button>
            <button class="btn ghost" data-role="reset">Reset</button>
          </div>
        </div>
      `;
      if(WIDE.matches){                                     // iPad: time boxes go under the badge
        const cd = row.querySelector('.custom-dur'), side = row.querySelector('.side');
        if(cd && side) side.appendChild(cd);
      }
      rowsEl.appendChild(row);

      let justDragged = false;
      row.querySelector('[data-role="startpause"]').addEventListener('click', ()=>{
        if(justDragged) return;
        startPause(t);
      });
      row.querySelector('[data-role="reset"]').addEventListener('click', ()=> reset(t));
      row.querySelectorAll('[data-role="mchk"]').forEach(cb=>{
        cb.addEventListener('change', ()=> setMultiplier(t, +cb.value));
      });

      const pillEl = row.querySelector('[data-role="pill"]');
      let dragging = false;
      pillEl.addEventListener('pointerdown', e=>{
        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        pillEl.classList.add('dragging');
        t.running = true;
        t.last = Date.now();
        seekPill(t, pillEl, e.clientX);
        updateRowLabels(row, t);
        ensureTick();
        try{ pillEl.setPointerCapture(e.pointerId); }catch(err){}
      });
      const onMove = e=>{
        if(!dragging) return;
        e.preventDefault();
        seekPill(t, pillEl, e.clientX);
      };
      const endDrag = e=>{
        if(!dragging) return;
        dragging = false;
        pillEl.classList.remove('dragging');
        try{ pillEl.releasePointerCapture(e.pointerId); }catch(err){}
        justDragged = true;
        setTimeout(()=>{ justDragged = false; }, 250);
        updateRowLabels(row, t);
        saveState();
      };
      pillEl.addEventListener('pointermove', onMove);
      pillEl.addEventListener('pointerup', endDrag);
      pillEl.addEventListener('pointercancel', endDrag);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      if(t.custom){
        const chEl = row.querySelector('[data-role="ch"]');
        const cmEl = row.querySelector('[data-role="cm"]');
        const csEl = row.querySelector('[data-role="cs"]');
        [chEl,cmEl,csEl].forEach(el=>{
          el.addEventListener('change', ()=> setCustomDuration(t, +chEl.value||0, +cmEl.value||0, +csEl.value||0));
        });
      }

      updateRowLabels(row, t);
    });
  }

  function updateRowLabels(row, t){
    const phaseEl = row.querySelector('[data-role="phase"]');
    const startBtn = row.querySelector('[data-role="startpause"]');
    const totalEl = row.querySelector('[data-role="total"]');
    if(!phaseEl || !startBtn) return;
    let text = '';
    if(t.phase === 'idle') text = t.rounds>1 ? ('rep 1 of '+t.rounds) : '';
    else if(t.phase === 'work' && t.onBreak){
      text = (t.running ? 'break' : 'break\npaused') + '\nnext ' + (t.round+1) + '/' + t.rounds;
    }
    else if(t.phase === 'work'){
      const state = t.running ? 'running' : 'paused';
      text = t.rounds>1 ? (state+'\nrep '+t.round+' of '+t.rounds) : state;
    }
    else text = 'done';
    phaseEl.textContent = text;
    phaseEl.className = 'phase ' + (t.onBreak && t.phase==='work' ? 'break' : t.phase);
    startBtn.textContent = t.phase==='done' ? 'Done' : (t.running ? 'Pause' : (t.phase==='idle' ? 'Start' : 'Resume'));
    startBtn.disabled = t.phase==='done';
    row.querySelectorAll('.mult label').forEach(l=>{
      l.classList.toggle('active', +l.dataset.m === t.rounds);
    });
    if(totalEl){
      totalEl.innerHTML = t.rounds>1
        ? `Total: <b>${fmt(t.base*t.rounds + breakSecs*(t.rounds-1))}</b>` + (breakSecs>0 ? ` <span style="opacity:.75">incl. breaks</span>` : '')
        : `Total: <b>${fmt(t.base)}</b>`;
    }
  }

  function updateDom(){
    timers.forEach(t=>{
      const row = rowsEl.querySelector(`.row[data-id="${t.id}"]`);
      if(!row) return;
      row.classList.toggle('active', t.phase==='work');
      row.classList.toggle('on-break', t.onBreak && t.phase==='work');
      row.classList.toggle('ending', t.running && t.phase==='work' && !t.onBreak && t.remaining <= 10);
      const clock = row.querySelector('[data-role="clock"]');
      if(clock) clock.textContent = fmt(t.remaining);
      const fill = row.querySelector('[data-role="pillfill"]');
      if(fill) fill.style.width = (t.phase==='idle' ? 0 : pctOf(t)) + '%';
      const pill = row.querySelector('[data-role="pill"]');
      if(pill) pill.classList.toggle('done', t.phase==='done');
      updateRowLabels(row, t);
    });
  }

  const floatChk = document.getElementById('floatChk');
  const floatToggle = document.getElementById('floatToggle');
  const floatNote = document.getElementById('floatNote');
  const wrapEl = document.querySelector('.wrap');

  function restartTick(){
    ticking = false;
    if(timers.some(t=>t.running)) ensureTick();
  }

  const floatMsg = document.getElementById('floatMsg');
  let floatMsgTimer = null;
  function showFloatMsg(text){
    floatMsg.textContent = text;
    clearTimeout(floatMsgTimer);
    floatMsgTimer = setTimeout(()=>{ floatMsg.textContent = ''; }, 4000);
  }

  async function openFloat(){
    if(!timers.some(t=>t.phase==='work')){
      floatChk.checked = false;
      showFloatMsg('Start a timer first, then tick this box.');
      return;
    }
    floatMsg.textContent = '';
    try{
      const active = Math.max(1, timers.filter(t=>t.phase==='work').length);
      pipWin = await documentPictureInPicture.requestWindow({ width:380, height: Math.min(560, active*128 + 24) });
    }catch(e){ pipWin = null; floatChk.checked = false; return; }
    const d = pipWin.document;
    d.title = 'Timer Bars';
    document.querySelectorAll('style').forEach(st => d.head.appendChild(st.cloneNode(true)));
    const theme = document.documentElement.getAttribute('data-theme');
    if(theme) d.documentElement.setAttribute('data-theme', theme);
    d.body.classList.add('pip');
    d.body.appendChild(rowsEl);
    const empty = d.createElement('p');
    empty.className = 'pip-empty';
    empty.textContent = 'No timers running. Untick "Float when minimized" to start one.';
    d.body.appendChild(empty);
    floatNote.hidden = false;
    restartTick();
    pipWin.addEventListener('pagehide', ()=>{
      wrapEl.appendChild(rowsEl);
      pipWin = null;
      floatChk.checked = false;
      floatNote.hidden = true;
      restartTick();
    });
  }

  if('documentPictureInPicture' in window){
    floatChk.addEventListener('change', ()=>{
      if(floatChk.checked) openFloat();
      else if(pipWin) pipWin.close();
    });
  } else {
    floatToggle.hidden = true;
  }

  (function(){
    const tip = document.getElementById('a2hs');
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    let dismissed = false;
    try{ dismissed = localStorage.getItem('timerbars-a2hs-dismissed') === '1'; }catch(e){}
    if(!standalone && !dismissed) tip.hidden = false;
    document.getElementById('a2hsClose').addEventListener('click', ()=>{
      tip.hidden = true;
      try{ localStorage.setItem('timerbars-a2hs-dismissed','1'); }catch(e){}
    });
  })();

  const breakChips = document.getElementById('breakChips');
  const breakCustom = document.getElementById('breakCustom');
  const breakCustomWrap = document.getElementById('breakCustomWrap');
  const breakState = document.getElementById('breakState');
  function showBreak(){
    const custom = breakSecs>0 && !BREAK_CHOICES.includes(breakSecs);
    breakChips.querySelectorAll('label[data-b]').forEach(l=>{
      const on = +l.dataset.b === breakSecs;
      l.classList.toggle('active', on); l.querySelector('input').checked = on;
    });
    breakCustomWrap.classList.toggle('active', custom);
    if(document.activeElement !== breakCustom) breakCustom.value = custom ? breakSecs : '';
    breakState.textContent = breakSecs>0 ? breakSecs + ' s' : 'off';
  }
  function setBreak(v){
    breakSecs = Math.max(0, Math.min(600, v|0));
    try{ localStorage.setItem('timerbars-break', String(breakSecs)); }catch(e){}
    showBreak(); updateDom();
  }
  breakChips.querySelectorAll('label[data-b] input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const v = +cb.closest('label').dataset.b;
      setBreak(cb.checked ? v : 0);
    });
  });
  breakCustom.addEventListener('change', ()=>{
    const v = Math.floor(+breakCustom.value) || 0;
    setBreak(v);
    breakCustom.value = (breakSecs>0 && !BREAK_CHOICES.includes(breakSecs)) ? breakSecs : '';
  });
  showBreak();

  render();
  if(timers.some(t=>t.running)) ensureTick();
})();
</script>
<script>
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
